version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: lms-app
    ports:
      - "8000:80"
    # volumes:
      # Mount a local .env if you wish to override values (uncomment line below)
      # - ./.env:/var/www/html/.env
    environment:
      # Environment variables can also be set here, prioritizing over .env
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: host.docker.internal
      DB_PORT: "3306"
      DB_DATABASE: lms
      DB_USERNAME: root
      DB_PASSWORD: ""
      LOG_CHANNEL: stderr
    restart: unless-stopped


